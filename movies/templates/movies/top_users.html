{% extends 'base.html' %}
{% block content %}
<div class = "p-3">
    <div class="container">
        <div class="row mt-3">
            <div class = "col mx-auto mb-3">
                <h2>Top Users By Purchases</h2>
                <hr />
                <form method="GET" class="row g-2 mb-4">
                    <div class="col-auto">
                        <label for="list_size" class="col-form-label">List size (leave blank for all users):</label>
                    </div>
                    <div class="col-auto">
                        <input type="number" min="1" name="list_size" id="list_size" value="{{ template_data.list_size }}" class="form-control">
                    </div>
                    <div class="col-auto">
                        <button type="submit" class="btn btn-dark">Update</button>
                    </div>
                </form>
                <table class="table table-bordered table-striped text-center">
                    <thead>
                        <tr>
                            <th scope="col">Rank</th>
                            <th scope="col">Username</th>
                            <th scope="col">Movies Purchased</th>
                        </tr>
                    </thead>
                    <tbody>
                        {% for u in template_data.users %}
                        <tr>
                            <td>{{ forloop.counter }}</td>
                            <td>{{ u.username }}</td>
                            <td>{{ u.movies_purchased }}</td>
                        </tr>
                        {% empty %}
                        <tr><td colspan="3">No purchases yet.</td></tr>
                        {% endfor %}
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>
{% endblock content %}
